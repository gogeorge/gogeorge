name: Refresh profile card

on:
  schedule:
    # 06:00 UTC daily. The footer stamp shows this build time.
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'scripts/**'
      - '.github/workflows/refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render both themes
        env:
          # GH_PAT (classic, read:user) unlocks the real contribution calendar.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: node scripts/build.mjs

      - name: Commit if the card changed
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add assets/github-dark.svg assets/github-light.svg
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m 'chore: refresh profile card'
            git push
          fi
